  try { const saved = JSON.parse(localStorage.getItem(STORE)||'null') || JSON.parse(localStorage.getItem('bitvaKrashей_v1')||'{}'); if(Array.isArray(saved.characters)) state.characters=saved.characters; } catch(e) {}
  const $ = (sel, root=app) => root.querySelector(sel);
  const esc = value => String(value??'').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
  const clamp = value => Math.max(1,Math.min(100,Number(value)||1));
  function save(){try{localStorage.setItem(STORE,JSON.stringify({characters:state.characters}));}catch(e){say('Не хватило места для сохранения. Попробуй фото поменьше.');}}
  function say(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(say.timer);say.timer=setTimeout(()=>toastEl.classList.remove('show'),2600);}
  function photoMarkup(c, cls=''){return c.img?`<img class="${cls}" src="${c.img}" alt="">`:`<span class="emoji ${cls}">${esc(c.emoji||'🧑‍🎤')}</span>`;}
  function avatar(c){return c.img?`<img src="${c.img}" alt="">`:`<span>${esc(c.emoji||'🧑‍🎤')}</span>`;}
  function renderHome(){return `<section class="home screen"><div class="home-inner"><div class="swords">⚔️</div><h1 class="hero-title">БИТВА <span>КРАШЕЙ</span></h1><p class="tagline">Доберитесь до короля,<br><strong>пока он не разжирел до саб3</strong></p><button class="button" id="play-button">▶ ИГРАТЬ</button><div class="home-note">Создай своих бойцов и выясни, кто дойдёт до трона.</div></div></section>`;}
  function renderSetup(){
    const editing=state.characters.find(c=>c.id===state.editId);
    const count=state.characters.length;
    return `<section class="screen"><div class="page-heading"><div><h1>Выбор крашей</h1><div class="muted">Добавь двух или больше бойцов.</div></div><div class="count">В составе: <b>${count}</b></div></div><div class="setup-grid"><section class="card form-panel"><h2 class="form-title">${editing?'Изменить краша':'Новый краш'}</h2><form id="character-form"><div class="field"><label for="name">Имя</label><input id="name" name="name" type="text" maxlength="38" placeholder="Имя или прозвище" value="${esc(editing?.name||'')}" required></div><div class="field"><label for="power">Сила <b id="power-out">${editing?.power??60}</b></label><div class="range-meta"><input id="power" name="power" type="range" min="1" max="100" value="${editing?.power??60}"></div></div><div class="field"><label for="speed">Скорость <b id="speed-out">${editing?.speed??55}</b></label><div class="range-meta"><input id="speed" name="speed" type="range" min="1" max="100" value="${editing?.speed??55}"></div></div><div class="field"><label for="endurance">Стойкость <b id="endurance-out">${editing?.endurance??60}</b></label><div class="range-meta"><input id="endurance" name="endurance" type="range" min="1" max="100" value="${editing?.endurance??60}"></div></div><div class="field"><label>Фото лица</label><div class="photo-row"><div class="preview" id="photo-preview">${state.pendingImage||editing?.img?`<img src="${state.pendingImage||editing.img}" alt="">`:'🖼️'}</div><div><label class="file-button">Выбрать фото<input id="character-photo" type="file" accept="image/*"></label></div></div></div><div class="form-footer"><button type="button" class="button" id="save-character">${editing?'Сохранить':'＋ Добавить краша'}</button>${editing?'<button type="button" class="button secondary" id="cancel-edit">Отмена</button>':''}</div></form></section><section class="card"><div class="roster-head"><h2>Твои краши</h2><button class="button secondary small" id="demo-button">Демо-состав</button></div><div class="roster-list">${count?state.characters.map((c,i)=>`<article class="character"><div class="character-head"><div class="portrait">${avatar(c)}</div><div class="char-details"><div class="char-name">${esc(c.name)}</div><div class="char-stats">Сила ${c.power} · Скорость ${c.speed}<br>Стойкость ${c.endurance}</div></div><div class="char-actions"><button class="icon-button" data-edit="${c.id}" title="Изменить">✎</button><button class="icon-button" data-delete="${c.id}" title="Удалить">×</button></div></div></article>`).join(''):'<div class="empty"><b>Пока никого нет</b>Добавь первого персонажа слева.</div>'}</div></section></div><div class="start-row"><p>${count<2?'Для турнира нужны хотя бы два краша.':'Состав готов к турниру.'}</p><button class="button gold" id="start-tournament" ${count<2?'disabled':''}>Начать турнир →</button></div></section>`;
  }
  function makeMatch(a,b,index){return {id:uid(),index,a,b,done:!b,winner:b?null:a,statsA:{power:a.power,speed:a.speed,endurance:a.endurance},statsB:b?{power:b.power,speed:b.speed,endurance:b.endurance}:null,boosts:{blessing:false,curse:false},log:[]};}
  function makeRound(list,number){const matches=[];for(let i=0;i<list.length;i+=2)matches.push(makeMatch(list[i],list[i+1]||null,matches.length));return {number,matches};}
  function roundNow(){return state.tournament?.rounds[state.tournament.roundIndex]||null;}
  function matchNow(){return roundNow()?.matches.find(m=>!m.done)||null;}
  function advanceByes(){const t=state.tournament;if(!t)return;while(t.roundIndex<t.rounds.length){const round=t.rounds[t.roundIndex];if(!round.matches.every(m=>m.done))break;const winners=round.matches.map(m=>m.winner).filter(Boolean);if(winners.length<=1){t.champion=winners[0]||null;break;}t.rounds.push(makeRound(winners,t.rounds.length+1));t.roundIndex++;}}
  function startTournament(){if(state.characters.length<2){say('Добавь хотя бы двух крашей.');return;}const entrants=state.characters.map(c=>({...c}));for(let i=entrants.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[entrants[i],entrants[j]]=[entrants[j],entrants[i]];}state.tournament={rounds:[makeRound(entrants,1)],roundIndex:0,champion:null};state.fighting=false;state.awaitingAdvance=false;state.lastResult=null;advanceByes();state.screen='arena';render();}
  function renderFighter(c,stats,side,hp=100){return `<div class="fighter fighter-${side}"><div class="doll"><div class="doll-head">${avatar(c)}</div><div class="doll-body"><i class="leg left"></i><i class="leg right"></i></div><i class="fist left">✊</i><i class="fist right">✊</i></div><div class="fighter-name">${esc(c.name)}</div><div class="fighter-stats">Сила ${stats.power} · Скорость ${stats.speed}</div><div class="hp"><span style="width:${hp}%"></span></div></div>`;}
  function renderArena(){
    const t=state.tournament,round=roundNow();
    if(!t)return `<section class="card empty"><b>Турнир ещё не начался</b><button class="button" id="back-setup">К выбору крашей</button></section>`;
    const match=matchNow();
    let contents='';
    if(state.awaitingAdvance&&state.lastResult){const w=state.lastResult.winner;contents=`<div class="result"><div class="winner-portrait">${avatar(w)}</div><h2>Победитель — ${esc(w.name)}!</h2><p>${esc(state.lastResult.text)}</p><button class="button gold" id="continue-tournament">${t.champion?'К королевскому финалу':'Следующий бой →'}</button></div>`;}
    else if(match){const a=match.a,b=match.b;const count=round.matches.length;contents=`<div class="fight-title"><h2>Раунд ${t.roundIndex+1} · бой ${match.index+1} из ${count}</h2><p>${state.fighting?'Бой идёт!':'Выбери буст или начинай бой.'}</p></div><div class="battlefield ${state.fighting?'fighting':''}">${renderFighter(a,match.statsA,'left') }<div class="versus"><span>VS</span>💥</div>${renderFighter(b,match.statsB,'right')}</div><div class="boosts"><div class="boost"><div class="boost-copy"><b>✨ Благословение короля</b><span>Усилить выбранного бойца.</span></div><button class="button gold small" id="bless" ${match.boosts.blessing||state.fighting?'disabled':''}>${match.boosts.blessing?'Готово':'Благословить'}</button></div><div class="boost"><div class="boost-copy"><b>🌀 Кара луксмаксеров</b><span>Ослабить выбранного бойца.</span></div><button class="button secondary small" id="curse" ${match.boosts.curse||state.fighting?'disabled':''}>${match.boosts.curse?'Готово':'Наложить кару'}</button></div></div><div class="target-line">Цель буста <select id="boost-target"><option value="a">${esc(a.name)}</option><option value="b">${esc(b.name)}</option></select></div><div class="battle-actions"><div class="muted">${match.log.length?esc(match.log[match.log.length-1]):'Бой до победного удара.'}</div><button class="button" id="fight" ${state.fighting?'disabled':''}>${state.fighting?'Идёт бой…':'⚔️ Начать бой'}</button></div>`;}
    else {contents=`<div class="result"><div class="winner-portrait">👑</div><h2>Турнир завершён!</h2><p>Победитель ждёт аудиенции у короля.</p><button class="button gold" id="go-finale">Финальная сцена →</button></div>`;}
    const allMatches=t.rounds.flatMap(r=>r.matches).map((m,i)=>`<span>${esc(m.a.name)}${m.b?' × '+esc(m.b.name):' · проход'}${m.done&&m.b?' → '+esc(m.winner.name):''}</span>`).join('');
    return `<section class="screen"><div class="arena-head"><div><h1>Турнирная арена</h1><p>Смотри, как краши дерутся за выход к королю.</p></div><div class="round-badge">${t.champion?'Турнир завершён':'Раунд '+(t.roundIndex+1)}</div></div><section class="card battle-card">${contents}</section><div class="bracket">${allMatches}</div><div style="margin-top:14px"><button class="button secondary small" id="back-setup">← К составу</button></div></section>`;
  }
  function renderFinale(){const champ=state.tournament?.champion;if(!champ)return `<section class="card empty"><b>Король пока ждёт.</b><button class="button" id="back-setup">К составу</button></section>`;return `<section class="screen"><div class="finale-head"><h1>Королевский финал</h1><p id="final-caption">Чемпион добирается до трона…</p></div><div class="final-stage" id="final-stage" data-phase="0"><div class="floor"></div><div class="throne"><div class="throne-back"></div><div class="throne-seat"></div><div class="king"><div class="king-crown">👑</div><div class="king-face"><img src="${KING_IMAGE}" alt="Великий Король"></div><div class="king-torso"><span class="king-arm left"></span><span class="king-arm right"></span><span class="king-belt"></span></div><div class="king-legs"><span class="king-leg left"></span><span class="king-leg right"></span></div></div><div class="king-flex">💪😎</div></div><div class="champion"><div class="champion-face">${avatar(champ)}</div><div class="champion-body"></div><div class="heart">❤️</div></div><div class="final-caption" id="final-stage-caption">Он приносит королю сердце…</div><div class="final-title" id="final-title"><div><strong>ПОБЕДИЛ<br>ВЕЛИКИЙ КОРОЛЬ</strong><span>👑 ВСЯ ВЛАСТЬ ЕГО 👑</span></div></div></div><div class="final-controls"><button class="button gold" id="replay-finale">Повторить сцену</button><button class="button secondary" id="back-arena">Турнирная сетка</button><button class="button secondary" id="back-setup">Главное меню состава</button></div></section>`;}
  function render(){document.getElementById('home-button').style.display=state.screen==='home'?'none':'inline-flex';if(state.screen==='home')app.innerHTML=renderHome();else if(state.screen==='setup')app.innerHTML=renderSetup();else if(state.screen==='arena')app.innerHTML=renderArena();else app.innerHTML=renderFinale();wire();}
  function compressPhoto(file,maxEdge=500){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/')){reject(new Error('Выбери изображение.'));return;}if(file.size>12*1024*1024){reject(new Error('Фото должно быть меньше 12 МБ.'));return;}const reader=new FileReader();reader.onerror=()=>reject(new Error('Не удалось прочитать фото.'));reader.onload=()=>{const im=new Image();im.onerror=()=>resolve(String(reader.result));im.onload=()=>{const scale=Math.min(1,maxEdge/Math.max(im.width,im.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.75));};im.src=String(reader.result);};reader.readAsDataURL(file);});}
  function saveCharacter(event){
    if(event && typeof event.preventDefault==='function') event.preventDefault();
    const form = event && event.currentTarget && event.currentTarget.id==='character-form'
      ? event.currentTarget
      : $('#character-form');
    if(!form){say('Не удалось открыть форму. Вернись к выбору крашей и попробуй ещё раз.');return;}
    const fd = new FormData(form);
    const name = String(fd.get('name') || '').trim();
    if(!name){$('#name')?.focus();say('Сначала введи имя краша.');return;}
    const data={name,power:clamp(fd.get('power')),speed:clamp(fd.get('speed')),endurance:clamp(fd.get('endurance'))};
    if(state.editId){
      const i=state.characters.findIndex(c=>c.id===state.editId);
      if(i>=0) state.characters[i]={...state.characters[i],...data,img:state.pendingImage||state.characters[i].img};
      else state.characters.push({id:uid(),...data,img:state.pendingImage||'',emoji:'🧑‍🎤'});
    }else{
      state.characters.push({id:uid(),...data,img:state.pendingImage||'',emoji:['🧑‍🎤','🦊','🥷','🧛','🦁','🧙'][Math.floor(Math.random()*6)]});
    }
    state.editId=null;state.pendingImage='';
    save();render();say('Краш добавлен!');
  }
  function loadDemo(){const samples=[['Сэр Роман',78,55,69,'🦁'],['Лорд Вайб',53,91,48,'🦊'],['Капитан Риз',68,67,80,'🥷'],['Граф Редфлаг',88,39,61,'🧛']];const names=new Set(state.characters.map(c=>c.name.toLowerCase()));for(const [name,power,speed,endurance,emoji] of samples){if(!names.has(name.toLowerCase()))state.characters.push({id:uid(),name,power,speed,endurance,emoji,img:''});}save();render();}
  function boost(type){const m=matchNow();if(!m||state.fighting||m.boosts[type])return;const key=$('#boost-target')?.value==='b'?'b':'a';const stats=key==='a'?m.statsA:m.statsB;const c=key==='a'?m.a:m.b;const backfire=Math.random()<.04;if(type==='blessing'){if(backfire){stats.power=clamp(stats.power-13);stats.speed=clamp(stats.speed-10);say('Благословение дало сбой!');}else{stats.power=Math.min(125,stats.power+22);stats.speed=Math.min(125,stats.speed+16);say(`${c.name} получил благословение!`);}}else{if(backfire){stats.power=Math.min(125,stats.power+15);stats.speed=Math.min(125,stats.speed+10);say('Кара неожиданно усилила цель!');}else{stats.power=clamp(stats.power-20);stats.speed=clamp(stats.speed-15);say(`${c.name} ослаблен карой.`);}}m.boosts[type]=true;render();}
  function score(stats){return stats.power*1.13+stats.speed*.82+stats.endurance*.68+(Math.random()*22-11);}
  function fight(){const m=matchNow();if(!m||state.fighting)return;state.fighting=true;m.log.push('Бой начался!');render();setTimeout(()=>{if(!state.tournament)return;const winner=score(m.statsA)>=score(m.statsB)?m.a:m.b;const loser=winner.id===m.a.id?m.b:m.a;m.winner=winner;m.done=true;m.log.push(`${winner.name} победил ${loser.name}!`);state.fighting=false;state.awaitingAdvance=true;state.lastResult={winner,text:`${loser.name} выбывает из турнира.`};render();},2600);}
  function continueTournament(){state.awaitingAdvance=false;state.lastResult=null;advanceByes();if(state.tournament.champion){state.screen='finale';render();startFinale();}else render();}
  function startFinale(){const stage=$('#final-stage');if(!stage)return;stage.dataset.phase='0';const caption=$('#final-stage-caption');const heading=$('#final-caption');const setPhase=(n,cap)=>{const el=$('#final-stage');if(!el)return;el.dataset.phase=String(n);if(caption)caption.textContent=cap;if(heading)heading.textContent=n>=4?'Победитель здесь только один.':n===3?'Король празднует свою победу!':'Король принимает подношение…';};state.finaleTimer.forEach(clearTimeout);state.finaleTimer=[];state.finaleTimer.push(setTimeout(()=>setPhase(1,'Чемпион склоняет колено и протягивает сердце.'),1100));state.finaleTimer.push(setTimeout(()=>setPhase(2,'Король пинает чемпиона!'),2600));state.finaleTimer.push(setTimeout(()=>setPhase(3,'А теперь Великий Король флексит и танцует!'),3900));state.finaleTimer.push(setTimeout(()=>setPhase(4,''),6600));}
  function wire(){
    $('#play-button')?.addEventListener('click',()=>{state.screen='setup';state.editId=null;state.pendingImage='';render();});
    $('#character-form')?.addEventListener('submit',saveCharacter);
    $('#save-character')?.addEventListener('click',()=>saveCharacter());
    ['power','speed','endurance'].forEach(id=>$('#'+id)?.addEventListener('input',e=>$('#'+id+'-out').textContent=e.target.value));
    $('#character-photo')?.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{state.pendingImage=await compressPhoto(file);const preview=$('#photo-preview');if(preview)preview.innerHTML=`<img src="${state.pendingImage}" alt="">`;}catch(err){say(err.message);}});
    $('#cancel-edit')?.addEventListener('click',()=>{state.editId=null;state.pendingImage='';render();});
    $('#demo-button')?.addEventListener('click',loadDemo);
    $('#start-tournament')?.addEventListener('click',startTournament);
    $('#back-setup')?.addEventListener('click',()=>{state.screen='setup';render();});
    $$('[data-edit]').forEach(b=>b.addEventListener('click',()=>{state.editId=b.dataset.edit;state.pendingImage='';render();}));
    $$('[data-delete]').forEach(b=>b.addEventListener('click',()=>{state.characters=state.characters.filter(c=>c.id!==b.dataset.delete);if(state.editId===b.dataset.delete){state.editId=null;state.pendingImage='';}save();render();}));
    $('#bless')?.addEventListener('click',()=>boost('blessing'));
    $('#curse')?.addEventListener('click',()=>boost('curse'));
    $('#fight')?.addEventListener('click',fight);
    $('#continue-tournament')?.addEventListener('click',continueTournament);
    $('#go-finale')?.addEventListener('click',()=>{state.screen='finale';render();startFinale();});
    $('#replay-finale')?.addEventListener('click',startFinale);
    $('#back-arena')?.addEventListener('click',()=>{state.screen='arena';render();});
  }
  function $$(selector){return [...app.querySelectorAll(selector)];}
  document.getElementById('home-button').addEventListener('click',()=>{state.screen='home';state.editId=null;state.pendingImage='';render();});
  state.screen='home';render();
})();
</script>
</body>
</html>
